name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds

      - name: Update npm
        run: npm install -g npm@latest # trusted publishing requires npm CLI >= 11.5.1

      - run: npm ci

      - name: Set package version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --workspace=library

      - run: npm run build --workspace=library

      - name: Publish to npm
        run: npm publish --workspace=library # authenticates via OIDC, no token needed
