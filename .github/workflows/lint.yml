name: Lint

on:
  push:
    branches: [main]
    tags: ['**']

  pull_request:
    types: []

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --workspace=library
      - run: npm run build --workspace=library
      - run: npm run lint --workspace=demo
